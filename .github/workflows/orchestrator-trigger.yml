name: Orchestrator Comment Trigger

on:
  issue_comment:
    types: [created]

jobs:
  orchestrate:
    if: github.event.issue.pull_request != null && startsWith(github.event.comment.body, '@orchestrator')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./Polling_App

      - name: Run orchestrator command
        id: orchestrator
        env:
          ORCHESTRATOR_COMMENT: ${{ github.event.comment.body }}
        run: node scripts/orchestrator-comment-handler.js
        working-directory: ./Polling_App
        continue-on-error: true

      - name: Upload orchestrator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-artifacts-${{ github.sha }}
          path: Polling_App/.cq_artifacts

      - name: Post orchestrator response comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const responsePath = path.join(process.cwd(), 'Polling_App', '.orchestrator_response.md');
            const body = fs.existsSync(responsePath)
              ? fs.readFileSync(responsePath, 'utf8')
              : 'Orchestrator executed, but no response file was generated.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
